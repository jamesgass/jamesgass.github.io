
<!DOCTYPE html>
<html>
<head>
    
    <title>Mathjax to HTML Conversion</title>

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        body { display: flex; }
        nav { width: 200px; flex-shrink: 0; }
        main { padding-left: 20px; }
    </style>
</head>
<body>


    <nav>
        <p><b><a href="index.html">Menu</a></b></p>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="writing.html">Research and Writing</a></li>
            <li><a href="miscellaneous.html">Miscellaneous</a></li>
            <ul>
                <li><a href="#tools">Tools</a></li>
            </ul>
        </ul>
        <img src="images/dancingjesus.gif" style="max-width: 100%; height: auto;" alt="Dancing Jesus">
    </nav>

    <main>
<h1>Mathjax to HTML</h1>
        
<div style="display: flex; width: 100%; gap: 20px; font-family: sans-serif;">

  <div style="flex: 1; display: flex; flex-direction: column;">
    <label for="plain-latex-in" style="margin-bottom: 5px; font-weight: bold;">LaTeX Input</label>
    <textarea id="plain-latex-in" style="height: 400px; resize: vertical; padding: 8px; font-family: monospace;"></textarea>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column;">
    <label for="plain-html-out" style="margin-bottom: 5px; font-weight: bold;">HTML Output</label>
    <textarea id="plain-html-out" readonly style="height: 400px; resize: vertical; padding: 8px; font-family: monospace; background-color: #f5f5f5;"></textarea>
  </div>

</div>

<script>
  (function() {
    const inputArea = document.getElementById('plain-latex-in');
    const outputArea = document.getElementById('plain-html-out');

    inputArea.addEventListener('input', function() {
        let text = this.value;
        if (!text.trim()) {
            outputArea.value = '';
            return;
        }

        let html = text
            .replace(/\\section\{([^}]+)\}/g, '<h2>$1</h2>')
            .replace(/\\subsection\{([^}]+)\}/g, '<h3>$1</h3>')
            .replace(/\\textbf\{([^}]+)\}/g, '<strong>$1</strong>')
            .replace(/\\textit\{([^}]+)\}/g, '<em>$1</em>');

        let paragraphs = html.split(/\n\n+/);
        html = paragraphs.map(p => {
            let trimmed = p.trim();
            if (trimmed.startsWith('<h')) return trimmed;
            trimmed = trimmed.replace(/\n/g, '<br>\n');
            return `<p>\n  ${trimmed}\n</p>`;
        }).join('\n\n');

        outputArea.value = html;
    });
  })();
</script>
    </main>

</body>
</html>
